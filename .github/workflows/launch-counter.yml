name: Launch counter

# Keeps docs/launch.json in step with the Polar LAUNCH discount so the pricing
# card can flip to the full price once the cap is
# hit. Polar enforces the cap itself; this only updates the copy. Commits
# only when the count changed. Pushes made with GITHUB_TOKEN do not trigger
# other workflows, so it dispatches pages.yml explicitly after committing.
#
# Repository secret: POLAR_ACCESS_TOKEN (organization token, discounts:read).

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: launch-counter
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-launch.js
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/launch.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/launch.json
          git commit -m "Update launch counter"
          git push
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
